[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "desk"
version = "0.1.0"
description = "A frameless, always-on-top widget deck (board · focus · capture) built in Textual."
requires-python = ">=3.10"
dependencies = ["textual"]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.scripts]
desk = "desk.app:main"

[tool.setuptools]
packages = ["desk"]

[tool.setuptools.package-data]
desk = ["*.tcss"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
